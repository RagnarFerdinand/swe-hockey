<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matcher">
<title>Matcher i tidsordning</title>
<style>
  :root {
    --bg: #f4f6f9; --kort: #fff; --text: #14213d; --svag: #6b7280; --linje: #e3e7ee;
    --accent: #0b5cad; --idag: #d7263d;
    /* Ett lag per färg när flera lag visas */
    --f0: #e0a800; --f1: #2f7fe0; --f2: #1f9d57; --f3: #d6336c; --f4: #7b4fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --kort: #19212c; --text: #e7ecf3; --svag: #95a0b0; --linje: #2a3441;
      --accent: #6cb4ff; --idag: #ff6b7d;
      --f0: #f0c040; --f1: #5aa2f5; --f2: #3cc47a; --f3: #f06292; --f4: #a484f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: #0b2545; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
  header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .hjalp { font: inherit; font-size: 16px; font-weight: 700; width: 28px; height: 28px; border-radius: 50%; padding: 0;
    border: 1.5px solid rgba(255,255,255,.7); background: transparent; color: #fff; line-height: 1; flex: none; }
  .hjalp[aria-expanded="true"] { background: #fff; color: #0b2545; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  .val { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px;
    background: var(--kort); border-bottom: 1px solid var(--linje); }
  .val label { font-size: 12px; color: var(--svag); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .val select { font-size: 16px; padding: 6px; border-radius: 8px; border: 1px solid var(--linje);
    background: var(--bg); color: var(--text); width: 100%; }
  .val .rad { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; font-size: 14px; color: var(--text); flex-direction: row; }
  main { padding: 8px 16px 40px; max-width: 720px; margin: 0 auto; }
  .status { color: var(--svag); padding: 24px 0; text-align: center; }
  h2.dag { font-size: 14px; color: var(--svag); margin: 18px 0 6px; }
  h2.dag.idag { color: var(--idag); }
  .match { background: var(--kort); border: 1px solid var(--linje); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 6px; display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 10px; align-items: baseline; }
  .match.farg { background: color-mix(in srgb, var(--farg) 13%, var(--kort)); border-color: color-mix(in srgb, var(--farg) 45%, var(--linje));
    border-left: 6px solid var(--farg); }
  .lagrad { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .lagknapp { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--linje);
    background: var(--bg); color: var(--text); display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
  .lagknapp:not(.lagg-till):not(.ta-bort)::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--farg); flex: none; }
  .lagknapp.aktiv { border-color: var(--farg); background: color-mix(in srgb, var(--farg) 18%, var(--kort)); font-weight: 600; }
  .lagknapp.lagg-till { color: var(--accent); border-style: dashed; }
  .lagknapp.ta-bort { color: var(--svag); border-color: transparent; background: transparent; font-size: 13px; }
  .match.spelad { opacity: .6; }
  .tid { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lag { font-weight: 600; }
  .lag b { font-weight: 800; }
  .res { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .info { grid-column: 2 / -1; font-size: 13px; color: var(--svag); }
  a { color: var(--accent); }
  footer { font-size: 12px; color: var(--svag); text-align: center; padding: 0 16px 30px; }
  .notis { background: var(--kort); border-bottom: 1px solid var(--linje); padding: 12px 16px; }
  .notis h2 { margin: 0 0 8px; font-size: 15px; }
  .notis button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; }
  .notis button.av { background: transparent; color: var(--accent); }
  .notis p { margin: 6px 0 0; font-size: 13px; color: var(--svag); }
  .dela-ikon { width: 14px; height: 16px; vertical-align: -2px; }
</style>
</head>
<body>
<header>
  <h1>Matcher i tidsordning <button id="hjalp" class="hjalp" type="button" aria-expanded="false" aria-controls="notis" aria-label="Notiser och hjälp">?</button></h1>
  <p id="undertext">Hämtas direkt från stats.swehockey.se</p>
</header>

<div id="notis" class="notis" hidden>
  <h2>🔔 Notis när en match flyttas</h2>
  <button id="notis-knapp" type="button"></button>
  <p id="notis-text"></p>
</div>

<div class="val">
  <div id="lagrad" class="lagrad" hidden></div>
  <label>Distrikt <select id="distrikt"></select></label>
  <label>Förening <select id="forening"></select></label>
  <label>Årskull / serie <select id="serie"></select></label>
  <label>Grupp <select id="grupp"></select></label>
  <label style="grid-column: 1 / -1">Lag <select id="lag"></select></label>
  <label class="rad"><input type="checkbox" id="visaSpelade"> Visa spelade matcher</label>
</div>

<main id="lista"><p class="status">Hämtar…</p></main>
<footer id="fot"></footer>

<script type="module">
import { lasSchema, ren } from './schema.js';

const BAS = 'https://stats.swehockey.se';
const $ = id => document.getElementById(id);
const las = (nyckel, annars) => { try { return JSON.parse(localStorage.getItem(nyckel)) ?? annars; } catch { return annars; } };
const skriv = (nyckel, v) => { try { localStorage.setItem(nyckel, JSON.stringify(v)); } catch {} };

// Förval: Sudrets HC, U14P Röd grupp 5
const FORVAL = { distrikt: '/District/Gotland', forening: 'Sudrets HC', serie: 'U14P', grupp: '21486', lag: 'Sudrets HC' };

// FLERA LAG — önskemål 2026-09-19: den som har barn i flera lag (Thomas har tre, fyra)
// ska se allas matcher i samma lista, varje lag i sin egen färg. Väljarna ändrar det
// lag som är markerat i raden ovanför dem. Tidigare sparades ett enda val under 'val'.
const lagen = (() => {
  const l = las('lagen', null);
  if (Array.isArray(l) && l.length) return l;
  const { visaSpelade, ...gammalt } = las('val', {});
  return [gammalt];
})();
let aktiv = Math.min(las('aktivtLag', 0), lagen.length - 1);
const MAX_LAG = 5;  // lika många som färgerna i CSS (--f0 … --f4)
const sparaLagen = () => { skriv('lagen', lagen); skriv('aktivtLag', aktiv); };
const val = k => lagen[aktiv][k] ?? (lagen.length === 1 ? FORVAL[k] : undefined);

const cache = new Map();
async function hamta(sokvag) {
  if (cache.has(sokvag)) return cache.get(sokvag);
  const p = fetch(BAS + sokvag).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => new DOMParser().parseFromString(t, 'text/html'));
  cache.set(sokvag, p);
  p.catch(() => cache.delete(sokvag));
  return p;
}
const schemaSokvag = grupp => '/ScheduleAndResults/Schedule/' + grupp;

// Swehockeys rullgardiner har en rubrik (h5 eller label) strax före sig: "Clubs in …", "Tournament", "Group"
function rullgardin(doc, rubrik) {
  for (const h of doc.querySelectorAll('h5, label')) {
    if (!ren(h.textContent).startsWith(rubrik)) continue;
    const sel = h.parentElement.querySelector('select');
    if (!sel) continue;
    return [...sel.querySelectorAll('option')]
      .filter(o => !o.disabled && o.value && o.value !== '0' && !o.value.endsWith('/District'))
      .filter(o => o.getAttribute('id') !== 'chooseany')
      .map(o => ({ namn: ren(o.textContent), sokvag: o.value }));
  }
  return [];
}
const idUr = sokvag => (sokvag.match(/\/(\d+)(?:\?|$)/) || [])[1];

function fyll(sel, poster, valt, text = p => p.namn, varde = p => p.namn) {
  sel.innerHTML = '';
  for (const p of poster) sel.add(new Option(text(p), varde(p)));
  const finns = poster.some(p => varde(p) === valt);
  if (finns) sel.value = valt;
  return poster.find(p => varde(p) === sel.value);
}

async function laddaDistrikt() {
  const doc = await hamta('/District/Gotland');
  const set = new Map();
  for (const a of doc.querySelectorAll('a[href^="/District/"]')) {
    const m = a.getAttribute('href').match(/^\/District\/[A-Za-z]+$/);
    if (m && !set.has(m[0])) set.set(m[0], ren(a.textContent));
  }
  const poster = [...set].map(([sokvag, namn]) => ({ sokvag, namn })).sort((a, b) => a.namn.localeCompare(b.namn, 'sv'));
  fyll($('distrikt'), poster, val('distrikt'), p => p.namn, p => p.sokvag);
  await laddaForeningar();
}

async function laddaForeningar() {
  const doc = await hamta($('distrikt').value);
  const poster = rullgardin(doc, 'Clubs in');
  fyll($('forening'), poster, val('forening'));
  await laddaSerier();
}

async function laddaSerier() {
  const f = [...$('forening').options].length ? rullgardin(await hamta($('distrikt').value), 'Clubs in')
    .find(p => p.namn === $('forening').value) : null;
  if (!f) return tomt('Ingen förening hittades.');
  const doc = await hamta(f.sokvag);
  const poster = rullgardin(doc, 'Tournament');
  fyll($('serie'), poster, val('serie'));
  await laddaGrupper();
}

async function laddaGrupper() {
  const f = rullgardin(await hamta($('distrikt').value), 'Clubs in').find(p => p.namn === $('forening').value);
  const s = rullgardin(await hamta(f.sokvag), 'Tournament').find(p => p.namn === $('serie').value);
  if (!s) return tomt('Föreningen har inga serier.');
  const doc = await hamta(s.sokvag);
  const poster = rullgardin(doc, 'Group').map(p => ({ ...p, id: idUr(p.sokvag) }));
  fyll($('grupp'), poster, val('grupp'), p => p.namn, p => p.id);
  await laddaMatcher();
}

async function laddaMatcher() {
  const id = $('grupp').value;
  if (!id) return tomt('Ingen grupp vald.');
  $('lista').innerHTML = '<p class="status">Hämtar matcher…</p>';
  const doc = await hamta(schemaSokvag(id));
  const matcher = lasSchema(doc);
  const lag = [...new Set(matcher.flatMap(m => [m.hemma, m.borta]))].sort((a, b) => a.localeCompare(b, 'sv'));
  const valtLag = val('lag');
  fyll($('lag'), [{ namn: 'Alla lag' }, ...lag.map(namn => ({ namn }))],
    lag.includes(valtLag) ? valtLag : (lag.find(l => l.startsWith($('forening').value)) || 'Alla lag'));
  // Hela valet sparas, så att laget kan visas och hämtas även när ett annat lag är markerat.
  Object.assign(lagen[aktiv], {
    distrikt: $('distrikt').value, forening: $('forening').value, serie: $('serie').value,
    grupp: id, gruppNamn: $('grupp').selectedOptions[0]?.text || '', lag: $('lag').value,
  });
  sparaLagen();
  const uppd = ren(doc.querySelector('.tdTitleRight')?.textContent);
  $('fot').textContent = (uppd ? uppd.replace('Last update', 'Senast uppdaterad hos Swehockey') + ' · ' : '') + 'Källa: stats.swehockey.se';
  await visa();
}

const lagNamn = t => t.lag && t.lag !== 'Alla lag' ? t.lag : (t.gruppNamn || 'Alla lag');
const spelarI = (t, m) => !t.lag || t.lag === 'Alla lag' || m.hemma === t.lag || m.borta === t.lag;

function ritaLagrad() {
  const rad = $('lagrad');
  rad.hidden = false;
  rad.replaceChildren(...lagen.map((t, i) => {
    const knapp = document.createElement('button');
    knapp.type = 'button';
    knapp.className = 'lagknapp' + (i === aktiv ? ' aktiv' : '');
    knapp.style.setProperty('--farg', `var(--f${i})`);
    knapp.setAttribute('aria-pressed', String(i === aktiv));
    knapp.textContent = `${t.serie || '…'} · ${lagNamn(t)}`;
    knapp.addEventListener('click', () => {
      if (i === aktiv) return;
      aktiv = i; sparaLagen(); ritaLagrad();
      laddaDistrikt().catch(fel);
    });
    return knapp;
  }));
  if (lagen.length < MAX_LAG) {
    const ny = document.createElement('button');
    ny.type = 'button';
    ny.className = 'lagknapp lagg-till';
    ny.textContent = '+ Lägg till lag';
    ny.addEventListener('click', () => {
      // Det nya laget börjar som en kopia av det markerade — oftast samma förening, annan årskull.
      const { lag, grupp, gruppNamn, ...samma } = lagen[aktiv];
      lagen.push(samma);
      aktiv = lagen.length - 1; sparaLagen(); ritaLagrad();
      laddaDistrikt().then(() => $('serie').focus()).catch(fel);
    });
    rad.append(ny);
  }
  if (lagen.length > 1) {
    const bort = document.createElement('button');
    bort.type = 'button';
    bort.className = 'lagknapp ta-bort';
    bort.textContent = 'Ta bort markerat lag';
    bort.addEventListener('click', () => {
      lagen.splice(aktiv, 1);
      aktiv = 0; sparaLagen(); ritaLagrad();
      laddaDistrikt().catch(fel);
    });
    rad.append(bort);
  }
}

let visning = 0;
async function visa() {
  const denna = ++visning;
  ritaLagrad();
  notisValAndrat();
  const klara = lagen.filter(t => t.grupp);
  const scheman = await Promise.all(klara.map(t => hamta(schemaSokvag(t.grupp)).then(lasSchema)));
  if (denna !== visning) return;  // ett nyare val har redan ritat om

  const visaSpelade = $('visaSpelade').checked;
  const idag = new Date().toLocaleDateString('sv-SE');
  const flera = lagen.length > 1;
  // Samma match kan höra till två av lagen (syskon i samma grupp som möter varandra) — visas en gång.
  const perMatch = new Map();
  let antalSpelade = 0;
  klara.forEach((t, i) => {
    for (const m of scheman[i]) {
      if (!spelarI(t, m)) continue;
      if (m.resultat || m.datum < idag) antalSpelade++;
      if (!visaSpelade && (m.resultat || m.datum < idag)) continue;
      const nyckel = `${t.grupp}|${m.nr}|${m.hemma}|${m.borta}|${m.datum}`;
      if (!perMatch.has(nyckel)) perMatch.set(nyckel, { ...m, farg: lagen.indexOf(t) });
    }
  });
  const urval = [...perMatch.values()]
    .sort((a, b) => (a.datum + (a.tid || '99:99')).localeCompare(b.datum + (b.tid || '99:99')) || a.farg - b.farg || a.ordning - b.ordning);

  $('undertext').textContent = flera ? `${lagen.length} lag`
    : `${$('serie').value} · ${$('grupp').selectedOptions[0]?.text || ''}`;

  if (!urval.length) {
    return tomt(antalSpelade && !visaSpelade ? `Inga kommande matcher. ${antalSpelade} spelade – bocka i "Visa spelade matcher".` : 'Inga matcher.');
  }
  const egnaLag = new Set(lagen.map(t => t.lag).filter(l => l && l !== 'Alla lag'));
  const fet = n => egnaLag.has(n) ? `<b>${esc(n)}</b>` : esc(n);
  const html = [];
  let dag = null;
  for (const m of urval) {
    if (m.datum !== dag) {
      dag = m.datum;
      const d = new Date(dag + 'T12:00');
      let rubrik = d.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
      rubrik = rubrik[0].toUpperCase() + rubrik.slice(1);
      html.push(`<h2 class="dag${dag === idag ? ' idag' : ''}">${dag === idag ? 'Idag – ' : ''}${rubrik}</h2>`);
    }
    const res = m.resultat ? (m.lank ? `<a href="${BAS}${m.lank}" target="_blank" rel="noopener">${esc(m.resultat)}</a>` : esc(m.resultat)) : '';
    html.push(`<div class="match${m.resultat ? ' spelad' : ''}${flera ? ' farg' : ''}"${flera ? ` style="--farg: var(--f${m.farg})"` : ''}>
      <span class="tid">${esc(m.tid) || '–'}</span>
      <span class="lag">${fet(m.hemma)} – ${fet(m.borta)}</span>
      <span class="res">${res}</span>
      <span class="info">${esc(m.arena)}${m.perioder ? ' · ' + esc(m.perioder) : ''}${m.nr ? ' · nr ' + esc(m.nr.replace(/^.*Game:/, '')) : ''}</span>
    </div>`);
  }
  $('lista').innerHTML = html.join('');
  document.querySelector('h2.dag.idag')?.scrollIntoView({ block: 'start' });
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function tomt(text) { $('lista').innerHTML = `<p class="status">${esc(text)}</p>`; }
const fel = e => tomt('Kunde inte hämta från Swehockey (' + e.message + '). Försök igen om en stund.');

const kedja = { distrikt: laddaForeningar, forening: laddaSerier, serie: laddaGrupper, grupp: laddaMatcher };
const nedstroms = ['distrikt', 'forening', 'serie', 'grupp', 'lag'];
for (const k of nedstroms) {
  $(k).addEventListener('change', () => {
    lagen[aktiv][k] = $(k).value;
    // Ett nytt val högre upp gör valen under ogiltiga
    for (const u of nedstroms.slice(nedstroms.indexOf(k) + 1)) delete lagen[aktiv][u];
    sparaLagen();
    (kedja[k] ? kedja[k]() : visa()).catch(fel);
  });
}
$('visaSpelade').checked = !!las('visaSpelade', las('val', {}).visaSpelade);
$('visaSpelade').addEventListener('change', () => { skriv('visaSpelade', $('visaSpelade').checked); visa().catch(fel); });

// ── Notiser ─────────────────────────────────────────────────────────────
//
// Önskemål 2026-09-17: en notis när en match flyttas. Byggt som i Ras/Domare.
// Webbläsaren ger en anonym notisadress (push-prenumeration); den och grupp +
// lag för vart och ett av lagen sparas i projektets databas, inget annat. Kontrollen på GitHub jämför
// schemat varje timme och skickar (notiser/kontrollera.mjs). Stängs notiserna
// av raderas prenumerationen.

const NOTIS_NYCKEL = 'BCRQhurbnYVOFWIP8NRbA4Zv0EXMg1rm3egA064iNSuq2PxZCgg82mAhhwY7F497U925dZU0an8A6iXsKenz308';
// Projektets offentliga webbnyckel — en identifierare, ingen hemlighet.
// Säkerheten är databasens regler (firestore.rules): skriva sin egen, aldrig läsa.
const DB = 'https://firestore.googleapis.com/v1/projects/swehockey-matcher/databases/(default)/documents/notiser/';
const WEBBNYCKEL = 'AIzaSyDOXqpVedfaxC3BsaO6nUdKehJ1cQuF4vQ';

const kanNotiser = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
// En iPad i Safari säger sig vara en Mac. Pekskärmen avslöjar den — en Mac har ingen.
const arIphone = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const paHemskarmen = window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;

let tjanst = null;
let prenumeration = null;
let senastSparat = null;

const base64TillBytes = b64 => {
  const t = atob((b64 + '='.repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(t, c => c.charCodeAt(0));
};

async function dokumentId(endpoint) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint));
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}

const lagText = () => lagen.length > 1 ? 'dina lag'
  : $('lag').value === 'Alla lag' ? `lagen i ${$('grupp').selectedOptions[0]?.text || 'gruppen'}` : $('lag').value;

async function sparaPrenumeration() {
  const mina = lagen.filter(t => t.grupp).map(t => ({ grupp: t.grupp, lag: t.lag || 'Alla lag' }));
  if (!prenumeration || !mina.length) return;
  const val = JSON.stringify(mina);
  if (val === senastSparat) return;
  const id = await dokumentId(prenumeration.endpoint);
  const sub = prenumeration.toJSON();
  const kropp = { fields: {
    subscription: { mapValue: { fields: {
      endpoint: { stringValue: sub.endpoint },
      expirationTime: sub.expirationTime == null ? { nullValue: null } : { integerValue: String(sub.expirationTime) },
      keys: { mapValue: { fields: { p256dh: { stringValue: sub.keys.p256dh }, auth: { stringValue: sub.keys.auth } } } },
    } } },
    lagen: { arrayValue: { values: mina.map(t => ({ mapValue: { fields: {
      grupp: { stringValue: t.grupp }, lag: { stringValue: t.lag },
    } } })) } },
    uppdaterad: { timestampValue: new Date().toISOString() },
  } };
  const r = await fetch(`${DB}${id}?key=${WEBBNYCKEL}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(kropp),
  });
  if (!r.ok) throw new Error(`databasen svarade ${r.status}`);
  senastSparat = val;
}

async function slutaPrenumerera() {
  if (!prenumeration) return;
  const id = await dokumentId(prenumeration.endpoint);
  await fetch(`${DB}${id}?key=${WEBBNYCKEL}`, { method: 'DELETE' }).catch(() => {});
  await prenumeration.unsubscribe().catch(() => {});
  prenumeration = null;
  senastSparat = null;
}

// Byts, läggs till eller tas ett lag bort följer notiserna med.
function notisValAndrat() {
  if (prenumeration) sparaPrenumeration().catch(e => console.warn('Notiser:', e));
  ritaNotis();
}

function ritaNotis(meddelande) {
  const knapp = $('notis-knapp'), text = $('notis-text');
  if (!kanNotiser && !(arIphone && !paHemskarmen)) {
    knapp.hidden = true;
    text.textContent = 'Den här webbläsaren kan inte ta emot notiser.';
    return;
  }
  if (arIphone && !paHemskarmen) {
    knapp.hidden = true;
    // Safaris Dela-ikon (ruta med pil uppåt), ritad här så att texten visar vad man ska leta efter.
    const delaIkon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    delaIkon.setAttribute('viewBox', '0 0 20 24');
    delaIkon.setAttribute('class', 'dela-ikon');
    delaIkon.setAttribute('aria-label', 'Dela-ikonen');
    delaIkon.innerHTML = '<path d="M10 2v13M5.5 6.5 10 2l4.5 4.5M6.5 10H3.5v12h13V10h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
    text.replaceChildren(
      'Tryck på Dela (', delaIkon,
      '), sedan "Lägg till på hemskärmen", och öppna Matcher därifrån. Har du redan en ikon för sidan: ta bort den och lägg till den på nytt.');
    return;
  }
  knapp.hidden = false;
  if (Notification.permission === 'denied') {
    knapp.hidden = true;
    text.textContent = 'Notiser är avstängda för Matcher i telefonens inställningar.';
    return;
  }
  knapp.textContent = prenumeration ? 'Stäng av notiser' : 'Slå på notiser';
  knapp.classList.toggle('av', !!prenumeration);
  text.textContent = meddelande ?? (prenumeration
    ? `🔔 Notis på för ${lagText()}`
    : 'Vi sparar bara en anonym notisadress från telefonen och vilka lag du valt — inget namn, ingen e-post. Stänger du av raderas det.');
}

// Notisrutan ligger bakom frågetecknet i rubriken — den ska inte ta plats bland matcherna.
$('hjalp').addEventListener('click', () => {
  const oppen = $('notis').hidden;
  $('notis').hidden = !oppen;
  $('hjalp').setAttribute('aria-expanded', String(oppen));
});

$('notis-knapp').addEventListener('click', async () => {
  const knapp = $('notis-knapp');
  knapp.disabled = true;
  try {
    if (prenumeration) {
      await slutaPrenumerera();
      ritaNotis('Notiserna är avstängda.');
    } else {
      const svar = await Notification.requestPermission();
      if (svar !== 'granted') { ritaNotis(); return; }
      tjanst ??= await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      prenumeration = await tjanst.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64TillBytes(NOTIS_NYCKEL) });
      await sparaPrenumeration();
      ritaNotis(`Klart — du får en notis när en match för ${lagText()} flyttas.`);
    }
  } catch (err) {
    console.warn('Notiser:', err);
    ritaNotis('Det gick inte att slå på notiser just nu. Försök igen senare.');
  } finally {
    knapp.disabled = false;
  }
});

async function startaNotiser() {
  if (kanNotiser) {
    try {
      tjanst = await navigator.serviceWorker.register('sw.js');
      prenumeration = await tjanst.pushManager.getSubscription();
    } catch (err) {
      console.warn('Notiser:', err);
    }
  }
  notisValAndrat();
}

laddaDistrikt().then(startaNotiser).catch(fel);
</script>
